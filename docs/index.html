<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI를 이겨라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --stage: #10233a; --panel: #183250; --line: #2f5379;
  --ink: #f3f1e8; --ink-dim: #a9bcd3; --gold: #ffc83d;
  --font-show: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-body); line-height: 1.6;
  background: radial-gradient(ellipse 80% 50% at 50% -10%, #24507e 0%, transparent 70%), var(--stage);
  padding: 56px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 32px; }
.eyebrow { color: var(--gold); font-weight: 700; letter-spacing: 0.1em; margin: 0; }
h1 { font-family: var(--font-show); font-weight: 400; font-size: clamp(48px, 10vw, 96px); line-height: 1; margin: 8px 0 12px; }
h1 span { color: var(--gold); }
.lede { color: var(--ink-dim); margin: 0; font-size: 18px; }
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
a.card {
  display: grid; gap: 6px; text-decoration: none; color: var(--ink);
  background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 22px 24px;
}
a.card:hover, a.card:focus-visible { border-color: var(--gold); outline: none; }
a.card b { font-family: var(--font-show); font-weight: 400; font-size: 28px; color: var(--gold); }
a.card span { color: var(--ink-dim); }
footer { color: var(--ink-dim); font-size: 14px; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">겨울방학 1박 2일 AI 특강</p>
    <h1>AI를 <span>이겨라</span></h1>
    <p class="lede">속이고, 시키고, 직접 만들어 보는 2시간. 아래에서 필요한 화면을 연다.</p>
  </header>
  <nav class="links">
    <a class="card" href="quiz.html"><b>퀴즈쇼</b><span>TV에 띄우는 3라운드 퀴즈와 점수판</span></a>
    <a class="card" href="mission.html"><b>게임 제작 미션카드</b><span>팀별 노트북에 띄우는 레벨 카드와 복사용 주문</span></a>
  </nav>
  <footer>진행용 슬라이드는 저장소의 slides 폴더에 있다.</footer>
</div>
